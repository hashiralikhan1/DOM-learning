<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
   <link rel="stylesheet" href="style.css">
</head>

<body>
    <p class="main_heading">Rock Paper Scissor Game</p>
    <button class="game-icon" onclick=" 
   playGame('rock');
  
   "><img src="/images/rock-emoji.png" alt="" srcset=""> </button>

    <button class="game-icon" onclick=" 
   
   playGame('paper');
  
   "><img src="/images/paper-emoji.png" alt="" srcset=""> </button>

    <button class="game-icon" onclick=" 
   playGame('Scissor');
   
   "><img src="/images/scissor-emoji.png" alt="" srcset=""> </button>

    <p class="js-result"></p>
    <p class="js-moves game-ion">

    </p>


    <p class="js-score"></p>

    <button class="reset-btn" onclick=" 
   score.wins=0;
   score.ties=0;
   score.losses=0;
   localStorage.removeItem('score');
   updateScoreElement();
   ">Reset Button</button>

   <h2><a href="./dom.html"> to Main Page</a></h2>

    <script src="./javascript.js"></script>
</body>

</html>
